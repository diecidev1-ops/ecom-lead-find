<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Lead Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.1);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin-bottom: .5rem; }
  p { font-size: .9rem; color: #666; margin-bottom: 1.5rem; }
  input[type="password"] {
    width: 100%;
    padding: .75rem 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  input[type="password"]:focus { border-color: #4f46e5; }
  button {
    width: 100%;
    padding: .75rem;
    margin-top: 1rem;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #4338ca; }
  .error {
    color: #dc2626;
    font-size: .85rem;
    margin-top: .75rem;
    display: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a2e; color: #e0e0e0; }
    .card { background: #16213e; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    input[type="password"] { background: #1a1a2e; border-color: #334155; color: #e0e0e0; }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>Lead Finder</h1>
  <p>Inserisci la password per accedere</p>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Accedi</button>
    <div class="error" id="err">Password errata</div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (res.ok) {
    window.location.href = '/';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').select();
  }
});
</script>
</body>
</html>
