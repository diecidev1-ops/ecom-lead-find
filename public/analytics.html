<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics — Lead Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="dot"></span>
      <h1>Lead Finder</h1>
    </div>
    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Menu</div>
      <a href="/" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="/estrazione.html" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Estrazione
      </a>
      <a href="/telegram.html" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 2.4a2.2 2.2 0 0 0-1 .2l-16.5 7.5a2.25 2.25 0 0 0 .1 4.2l4.2 1.3 1.3 4.2a2.25 2.25 0 0 0 4.2.1l7.5-16.5a2.25 2.25 0 0 0-1.8-3z"/><path d="M10 15L15 10"/></svg>
        Telegram
      </a>
      <a href="/crm.html" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        CRM
      </a>
      <div class="sidebar__section-label">Strumenti</div>
      <a href="/profili.html" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Profili
      </a>
      <a href="/analytics.html" class="sidebar__link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
      <a href="/settings.html" class="sidebar__link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Impostazioni
      </a>
    </nav>
    <button class="sidebar__theme" id="theme-toggle">
      <svg class="theme-icon theme-icon--dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      <svg class="theme-icon theme-icon--light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="theme-label">Tema scuro</span>
    </button>
  </aside>
  <div class="sidebar__overlay" id="sidebar-overlay"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 class="topbar__title">Analytics</h2>
      </div>
      <div class="topbar-right"></div>
    </header>

    <main class="layout an-layout">
      <div class="an-header">
        <h2 class="an-title">Analytics</h2>
        <div class="an-filters">
          <div class="an-pills" id="an-pills">
            <button class="an-pill" data-days="7">7g</button>
            <button class="an-pill" data-days="14">14g</button>
            <button class="an-pill active" data-days="30">30g</button>
            <button class="an-pill" data-days="90">90g</button>
            <button class="an-pill" data-days="0">Tutto</button>
            <button class="an-pill" data-days="custom">Personalizzato</button>
          </div>
          <div class="an-date-range" id="an-date-range" hidden>
            <input type="date" id="an-date-from" class="an-date-input">
            <span class="an-date-sep">—</span>
            <input type="date" id="an-date-to" class="an-date-input">
          </div>
          <select class="an-select" id="an-platform">
            <option value="">Tutte le piattaforme</option>
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
          </select>
        </div>
      </div>

      <div class="an-kpis" id="an-kpis"></div>

      <div class="an-grid-2 an-grid-2--perf">
        <section class="an-card">
          <div class="an-card__head">
            <h3>Performance</h3>
            <div id="an-legend" class="an-legend"></div>
          </div>
          <div id="an-perf" class="an-chart-wrap"></div>
        </section>
        <section class="an-card">
          <div class="an-card__head"><h3>Funnel</h3></div>
          <div id="an-funnel"></div>
        </section>
      </div>

      <div class="an-grid-2">
        <section class="an-card">
          <div class="an-card__head"><h3>Piattaforme</h3></div>
          <div id="an-platforms"></div>
        </section>
        <section class="an-card">
          <div class="an-card__head"><h3>Distribuzione Score</h3></div>
          <div id="an-score-dist"></div>
        </section>
      </div>

      <section class="an-card">
        <div class="an-card__head"><h3>Lead nel tempo</h3></div>
        <div id="an-timeline" class="an-chart-wrap"></div>
      </section>

      <div class="an-grid-2">
        <section class="an-card">
          <div class="an-card__head"><h3>Salute CRM</h3></div>
          <div id="an-crm"></div>
        </section>
        <section class="an-card">
          <div class="an-card__head"><h3>Avvisi</h3></div>
          <div id="an-alerts"></div>
        </section>
      </div>

      <div class="an-grid-2">
        <section class="an-card">
          <div class="an-card__head"><h3>Obiettivo Mensile</h3></div>
          <div id="an-goals"></div>
        </section>
        <section class="an-card">
          <div class="an-card__head"><h3>Score &rarr; Conversione</h3></div>
          <div id="an-score-conv"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="sidebar.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
